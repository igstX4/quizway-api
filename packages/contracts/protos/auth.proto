syntax = "proto3";

package quizway.auth.v1;

// Authentication is isolated in its own service: it is the only process that
// knows about password hashes and signing keys.
service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc Refresh (RefreshRequest) returns (AuthResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (UserProfile);
  rpc GetUser (GetUserRequest) returns (UserProfile);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string full_name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message UserProfile {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  string created_at = 5;
}

message AuthResponse {
  UserProfile user = 1;
  string access_token = 2;
  string refresh_token = 3;
}
