# Declarative Kong configuration used by `docker compose --profile kong up`.
#
# The extra hop is optional: it exists to show how an API gateway would add
# routing, rate limiting and observability in front of the Nest gateway.
_format_version: "3.0"

services:
  - name: quizway-api
    url: http://gateway:4000
    routes:
      - name: public-api
        paths:
          - /api
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 600
              policy: local
          - name: correlation-id
            config:
              header_name: X-Request-Id
              generator: uuid
              echo_downstream: true

  - name: quizway-docs
    url: http://gateway:4000/api/docs
    routes:
      - name: docs
        paths:
          - /docs
        strip_path: true

plugins:
  - name: request-size-limiting
    config:
      allowed_payload_size: 2
